name: flutter_ai_subscriptions
description: "A professional AI key management and rotation package for Flutter. Supports multiple providers, automatic cool-down, and request generation."
version: 1.0.0
homepage: https://github.com/Rolandoepdw/flutter_ai_subscriptions

environment:
  sdk: ^3.12.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Persistence for keys
  flutter_secure_storage: ^11.0.0
  
  # Network requests for model discovery
  http: ^1.6.0
  
  # Model comparison and equality
  equatable: ^2.1.0

  # Unique identifiers for custom providers
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
