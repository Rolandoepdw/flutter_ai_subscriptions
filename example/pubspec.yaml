name: example
description: "Example application for flutter_ai_subscriptions package."
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  
  # The package being demonstrated
  flutter_ai_subscriptions:
    path: ../

  # Dependency injection for the app
  get_it: ^9.2.1
  
  # Extra utilities for the chat app
  uuid: ^4.5.1
  http: ^1.6.0
  equatable: ^2.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
